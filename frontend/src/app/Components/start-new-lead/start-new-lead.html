<div class="start-lead-container">
    <div class="page-header">
        <div class="header-title">
            <h2>Start New Lead</h2>
            <div class="date-time">Today, May 14, 2026 | 3:39PM</div>
        </div>
        <div class="header-location">
            <select class="form-control">
                <option>DP360 TEST Hawaii Marine - Waianae # 1077</option>
            </select>
        </div>
    </div>

    <form [formGroup]="leadForm" (ngSubmit)="onSubmit()">
        <!-- Lead Info Section -->
        <div class="section-header">
            <span>Lead Info</span>
            <mat-icon>keyboard_arrow_right</mat-icon>
        </div>
        <div class="form-grid lead-info-grid">
            <div class="form-group">
                <label>Lead Type</label>
                <select formControlName="lead_type" class="form-control">
                    <option value="Web Lead">Web Lead</option>
                    <option value="Event Lead">Event Lead</option>
                    <option value="Phone Lead">Phone Lead</option>
                </select>
            </div>
            <div class="form-group">
                <label>Step</label>
                <select formControlName="step" class="form-control">
                    <option value="New Lead">New Lead</option>
                </select>
            </div>
            <div class="form-group">
                <label>Open/Close</label>
                <select formControlName="open_close" class="form-control">
                    <option value="Open">Open</option>
                    <option value="Close">Close</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tag</label>
                <input type="text" formControlName="tag" class="form-control">
            </div>
            <div class="form-group"></div>
            <div class="form-group">
                <label>Source</label>
                <input type="text" formControlName="source" class="form-control" placeholder="Start typing source to see results">
            </div>

            <div class="form-group">
                <label>Sub Source</label>
                <select formControlName="sub_source" class="form-control">
                    <option value=""></option>
                </select>
            </div>
            <div class="form-group">
                <label>Sales Person</label>
                <input type="text" formControlName="sales_person" class="form-control">
            </div>
            <div class="form-group">
                <label>Split Deal User</label>
                <select formControlName="split_deal_user" class="form-control">
                    <option value=""></option>
                </select>
            </div>
        </div>

        <!-- Contact Info Section -->
        <div class="section-header">
            <span>Contact Info</span>
            <mat-icon>keyboard_arrow_right</mat-icon>
        </div>
        <div class="form-grid contact-info-grid">
            <div class="form-group">
                <label>First name</label>
                <input type="text" formControlName="first_name" class="form-control">
            </div>
            <div class="form-group">
                <label>Middle name</label>
                <input type="text" formControlName="middle_name" class="form-control">
            </div>
            <div class="form-group">
                <label>Last name</label>
                <input type="text" formControlName="last_name" class="form-control">
            </div>

            <div class="form-group with-icon">
                <label>Company name</label>
                <div class="input-icon-wrapper">
                    <input type="text" formControlName="company_name" class="form-control">
                    <mat-icon class="suffix-icon text-blue">add_circle_outline</mat-icon>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" class="form-control">
            </div>
            <div class="form-group">
                <label>Alternate Email</label>
                <input type="email" formControlName="alternate_email" class="form-control">
            </div>

            <div class="form-group">
                <label>Cell</label>
                <input type="text" formControlName="cell" class="form-control">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" formControlName="phone" class="form-control">
            </div>
            <div class="form-group">
                <label>Work Number</label>
                <input type="text" formControlName="work_number" class="form-control">
            </div>

            <div class="form-group">
                <label>Fax</label>
                <input type="text" formControlName="fax" class="form-control">
            </div>
            <div class="form-group">
                <label>Address <span class="required">*</span></label>
                <input type="text" formControlName="address" class="form-control">
            </div>
            <div class="form-group">
                <label>Address Line 2</label>
                <input type="text" formControlName="address_line_2" class="form-control">
            </div>

            <div class="form-group">
                <label>Country</label>
                <select formControlName="country" class="form-control">
                    <option value="United States (US)">United States (US)</option>
                </select>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" formControlName="city" class="form-control">
            </div>
            <div class="form-group">
                <label>State/Province</label>
                <input type="text" formControlName="state_province" class="form-control" placeholder="Start typing state/province to see results">
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-cancel" routerLink="/">Cancel</button>
            <button type="submit" class="btn-submit" [disabled]="!leadForm.valid">Submit</button>
        </div>
    </form>
</div>
